name: Bug report
description: Rafiq did something you did not expect.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Help us reproduce it. Logs and screenshots often contain server names and tokens, so blank those out before you paste.
        A security problem does not belong here. Use the security policy.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The release you installed, or the commit you built.
    validations:
      required: true
  - type: input
    id: bridge-version
    attributes:
      label: Bridge version
      description: The `version` field returned by `GET /health`.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: Galaxy Z Flip, Android 15
    validations:
      required: true
  - type: dropdown
    id: fold-state
    attributes:
      label: Fold state when it happened
      options:
        - Not a foldable
        - Closed, on the cover screen
        - Open
        - Half-folded (Flex Mode)
        - Changed while it happened
    validations:
      required: true
  - type: input
    id: agent-adapter
    attributes:
      label: Agent and adapter
      description: Which agent you ran and which ACP adapter launches it.
      placeholder: Claude Code via claude-agent-acp
  - type: textarea
    id: observed
    attributes:
      label: What you saw
      description: Include what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps
      placeholder: |
        1. Start a session on api-server
        2. Send a prompt that edits a file
        3. Fold the phone while the approval card is showing
    validations:
      required: true
  - type: textarea
    id: log-excerpt
    attributes:
      label: Log excerpt
      description: Bridge log lines or `adb logcat` output around the problem, with names and tokens removed.
      render: text
