name: Feature request
description: Tell us what Rafiq should do that it does not do yet.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Rafiq shows an agent's work as chat, tool calls, diffs and approvals. It does not emulate a terminal.
        If you are not sure yet whether you want a feature, start a discussion.
  - type: textarea
    id: situation
    attributes:
      label: Where were you when you needed this?
      description: Phone closed on the cover screen, half-folded on a desk, away from your server, and so on.
    validations:
      required: true
  - type: textarea
    id: wanted-behaviour
    attributes:
      label: What would you like Rafiq to do?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Anything you tried instead?
  - type: dropdown
    id: part
    attributes:
      label: Which part would change?
      multiple: true
      options:
        - Android app
        - Bridge
        - Event protocol
        - Documentation
        - Not sure
