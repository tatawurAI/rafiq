name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Rafiq is agent-agnostic and chat-based, not a terminal. Requests that fit those principles are the easiest to take on.
        For open-ended questions, use Discussions instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you have solved or worked around this.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android app
        - Bridge
        - Protocol
        - Documentation
        - Other
    validations:
      required: true
