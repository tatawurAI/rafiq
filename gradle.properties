# Kept modest so a build fits on a laptop that is running other things.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.configuration-cache=true
org.gradle.caching=true

kotlin.code.style=official

android.useAndroidX=true

# Version shared by the bridge and the app. It is not called "version" because
# the changelog task reads -Pversion as the release being cut.
rafiq.version=0.1.0
