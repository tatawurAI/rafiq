# Every dependency and plugin version for the build lives here, pinned.
# Add new entries here, never inline in a build file.

[versions]
# Bytecode level for every module. The bridge runs on JDK 21, and the Android
# toolchain desugars it for the app.
jvmTarget = "21"

kotlin = "2.4.21"
agp = "9.5.2"
android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "31"

# The newest Compose BOM whose libraries still accept compileSdk 36. Later BOMs
# require compileSdk 37.
compose-bom = "2026.06.01"
activity-compose = "1.13.0"

# App UI (screens and navigation). The newest release that still accepts compileSdk 36:
# navigation-compose 2.10 needs compileSdk 37. Lifecycle shares the data layer's entry below.
navigation-compose = "2.9.8"
# Markdown in chat bubbles. Apache-2.0. Later releases need compileSdk 37. It brings no
# Compose artifacts of its own, so the Compose BOM decides those versions.
markdown-renderer = "0.41.0"

kotlinx-serialization = "1.13.0"
kotlinx-coroutines = "1.11.0"
ktor = "3.6.1"
logback = "1.6.8"
# JDBC driver for the event log. It bundles the native SQLite library for every platform.
sqlite-jdbc = "3.50.3.0"

# The Agent Client Protocol (ACP) Kotlin SDK.
acp = "0.34.0"

junit = "5.14.4"

# The app's data layer: event cache, network, token storage and app lifecycle.
ksp = "2.3.13"
room = "2.8.5"
# OkHttp and lifecycle are the newest releases that still accept compileSdk 36. OkHttp 5.5 and
# lifecycle 2.11 require compileSdk 37.
okhttp = "5.4.0"
datastore = "1.3.0"
lifecycle = "2.10.0"

spotless = "8.11.0"
ktlint = "1.8.0"
detekt = "1.23.8"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-body-limit = { module = "io.ktor:ktor-server-body-limit", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

acp = { module = "com.agentclientprotocol:acp", version.ref = "acp" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

# The app's data layer.
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
